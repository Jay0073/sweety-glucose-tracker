services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sweety
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety
    ports:
      - "5433:5432"
    volumes:
      - sweety_postgres_data:/var/lib/postgresql/data
      - ./server/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://sweety:sweety@db:5432/sweety
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-sweety-local-development-secret}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Kolkata}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    build:
      context: ./client
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

volumes:
  sweety_postgres_data:

